    "hook": {
      "on-activate": "  bash \"$FLOX_ENV_PROJECT/scripts/setup-tricorder\" || return 1\n  export PATH=\"$FLOX_ENV_PROJECT/scripts:$FLOX_ENV_CACHE/tricorder-0.4.1.1-runtime-v1/bin:$PATH\"\n\n  # Outside nix-shell, the compiler wrapper needs the platform-specific target.\n  # Apply it to dependency builds as well as the project's own link steps.\n  if [ \"$(uname -s)\" = Darwin ]; then\n    export MACOSX_DEPLOYMENT_TARGET=\"${MACOSX_DEPLOYMENT_TARGET:-$(sw_vers -productVersion)}\"\n    export MACOSX_DEPLOYMENT_TARGET_arm64_apple_darwin=\"$MACOSX_DEPLOYMENT_TARGET\"\n    export MACOSX_DEPLOYMENT_TARGET_aarch64_apple_darwin=\"$MACOSX_DEPLOYMENT_TARGET\"\n  fi\n\n  # Reuse the native Cardano libraries from the local development setup.\n  native=\"$FLOX_ENV_PROJECT/.cache/native\"\n  if [ -d \"$native/lib/pkgconfig\" ]; then\n    export PKG_CONFIG_PATH=\"$native/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}\"\n    export LIBRARY_PATH=\"$native/lib${LIBRARY_PATH:+:$LIBRARY_PATH}\"\n    export C_INCLUDE_PATH=\"$native/include${C_INCLUDE_PATH:+:$C_INCLUDE_PATH}\"\n  fi\n  unset native\n"
    },
