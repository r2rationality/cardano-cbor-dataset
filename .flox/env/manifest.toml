schema-version = "1.17.0"

[install]
# Match Dockerfile with GHC 9.6.7 and HLS 2.10.0.0 from one Nixpkgs revision.
# The Flox catalog does not expose this compiler-specific HLS package.
ghc.flake = "github:NixOS/nixpkgs/e4b09e47ace7d87de083786b404bf232eb6c89d8#haskell.compiler.ghc967"
hls.flake = "github:NixOS/nixpkgs/e4b09e47ace7d87de083786b404bf232eb6c89d8#haskell.packages.ghc967.haskell-language-server"
cabal.pkg-path = "cabal-install"
hoogle.pkg-path = "haskellPackages.hoogle"
# Preserve HLS's runtime-library links where the packages overlap.
hoogle.priority = 6
pkg-config.pkg-path = "pkg-config"
zlib.pkg-path = "zlib"
zlib.outputs = "all"
# Tricorder, built from its own flake. Its binary cache is tweag-tricorder.cachix.org.
tricorder.flake = "github:tweag/tricorder#tricorder"
ormolu.pkg-path = "ormolu"
hspec-discover.pkg-path = "haskellPackages.hspec-discover"
hspec-discover.priority = 6
just.pkg-path = "just"
autoconf.pkg-path = "autoconf"
automake.pkg-path = "automake"
libtool.pkg-path = "libtool"
shellcheck.pkg-path = "shellcheck"
hlint.pkg-path = "hlint"

[hook]
on-activate = '''
  export PATH="$FLOX_ENV_PROJECT/scripts:$PATH"

  # Outside nix-shell, the compiler wrapper needs the platform-specific target.
  # Apply it to dependency builds as well as the project's own link steps.
  if [ "$(uname -s)" = Darwin ]; then
    export MACOSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET:-$(sw_vers -productVersion)}"
    export MACOSX_DEPLOYMENT_TARGET_arm64_apple_darwin="$MACOSX_DEPLOYMENT_TARGET"
    export MACOSX_DEPLOYMENT_TARGET_aarch64_apple_darwin="$MACOSX_DEPLOYMENT_TARGET"
  fi

  # Reuse the native Cardano libraries from the local development setup.
  native="$FLOX_ENV_PROJECT/.cache/native"
  if [ -d "$native/lib/pkgconfig" ]; then
    export PKG_CONFIG_PATH="$native/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
    export LIBRARY_PATH="$native/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
    export C_INCLUDE_PATH="$native/include${C_INCLUDE_PATH:+:$C_INCLUDE_PATH}"
  fi
  unset native
'''

[options]
systems = ["aarch64-darwin", "x86_64-linux"]
