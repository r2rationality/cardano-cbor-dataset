session:
  build:
    # The first start after a change of the Flox environment compiles the ledger packages, which takes far longer than
    # the default minute. The test and eval sessions below need the same.
    ghci:
      startup_timeout_ms: 5400000
    targets:
      - cardano-cbor-dataset:lib:cardano-cbor-dataset
      - cardano-cbor-dataset:exe:cbor
      - cardano-cbor-dataset:test:unit
      - cardano-cbor-dataset:test:normalization-vectors
  # The integration suite reads the whole dataset and takes minutes: run it with `just integration` before pushing a
  # dataset, not on every change, so it is not listed here.
  test:
    ghci:
      startup_timeout_ms: 5400000
    targets: [cardano-cbor-dataset:test:unit, cardano-cbor-dataset:test:normalization-vectors]
  eval:
    ghci:
      startup_timeout_ms: 5400000
  watch_dirs: [app, exe, test]
  logging:
    minimum_severity: INFO
  # Tricorder passes its own build directory to Cabal after the one that scripts/tricorder-tools/cabal chooses, so the
  # two are the same here.
  repl_build_dir: .cache/tricorder-build
